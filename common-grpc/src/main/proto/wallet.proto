syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.common.grpc.wallet";

package wallet;

service WalletService {
  rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse);

  rpc DeleteWallet (DeleteWalletRequest) returns (DeleteWalletResponse);

  rpc GetAllWallets (GetAllWalletsRequest) returns (GetAllWalletsResponse);

  rpc GetWalletById (GetWalletByIdRequest) returns (GetWalletByResponse);

  rpc GetWalletByUserId (GetWalletByUserIdRequest) returns (GetWalletByResponse);

  rpc Deposit (DepositRequest) returns (DepositResponse);

  rpc Withdraw (WithdrawRequest) returns (WithdrawResponse);
}

message WalletDto {
  int64 wallet_id = 1;
  int64 user_id = 2;
  double balance = 3;
}

message CreateWalletRequest {
  int64 user_id = 1; 
}

message CreateWalletResponse {
  bool success = 1;
  string message = 2;
  int64 wallet_id = 3;
}


message DeleteWalletRequest {
  oneof identifier {
    int64 wallet_id = 1;
    int64 user_id = 2;
  }
}

message DeleteWalletResponse {
  bool success = 1;
  string message = 2;
}

message GetAllWalletsRequest {}

message GetAllWalletsResponse {
  repeated WalletDto wallets = 1;
}

message GetWalletByIdRequest {
  int64 wallet_id = 1;
}

message GetWalletByUserIdRequest {
  int64 user_id = 1;
}

message GetWalletByResponse {
  bool success = 1;
  string message = 2;
  WalletDto wallet = 3;
}

message DepositRequest {
  double amount = 1;
  oneof identifier {
    int64 wallet_id = 2;
    int64 user_id = 3;
  }
}

message DepositResponse {
  bool success = 1;
  string message = 2;
  double new_balance = 3;
}

message WithdrawRequest {
  double amount = 1;
  oneof identifier {
    int64 wallet_id = 2;
    int64 user_id = 3;
  }
}

message WithdrawResponse {
  bool success = 1;
  string message = 2;
  double new_balance = 3;
}